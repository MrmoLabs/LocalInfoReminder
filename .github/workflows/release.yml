name: Build Windows release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2025
    timeout-minutes: 45

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Validate release version
        shell: pwsh
        run: |
          $releaseVersion = python tools/verify_release_version.py "${{ github.ref_name }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          [System.IO.File]::AppendAllText(
            $env:GITHUB_ENV,
            "RELEASE_VERSION=$releaseVersion`n",
            [System.Text.UTF8Encoding]::new($false)
          )

      - name: Configure update repository
        shell: pwsh
        run: |
          $configPath = Join-Path $env:GITHUB_WORKSPACE 'update_config.json'
          $config = Get-Content -LiteralPath $configPath -Raw -Encoding UTF8 | ConvertFrom-Json
          $config.github_repository = '${{ github.repository }}'
          $json = $config | ConvertTo-Json -Depth 10
          [System.IO.File]::WriteAllText($configPath, $json + "`n", [System.Text.UTF8Encoding]::new($false))

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt "pyinstaller>=6.19,<7"

      - name: Run tests
        run: python -m pytest -q

      - name: Build portable application
        run: python -m PyInstaller packaging/specs/LocalInfoReminder.spec --noconfirm --clean

      - name: Build installer and portable archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) {
            $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          }
          if (-not (Test-Path -LiteralPath $iscc)) {
            throw 'Inno Setup compiler ISCC.exe was not found on the runner.'
          }
          & $iscc "/DAppVersion=$env:RELEASE_VERSION" "/DGitHubRepository=${{ github.repository }}" 'packaging\installer\LocalInfoReminder.iss'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $zipName = "LocalInfoReminder-$env:RELEASE_VERSION-Windows-x64.zip"
          Compress-Archive -LiteralPath 'dist\LocalInfoReminder' -DestinationPath (Join-Path 'release' $zipName) -CompressionLevel Optimal

          $assets = Get-ChildItem -LiteralPath release -File | Where-Object { $_.Extension -in '.exe', '.zip' } | Sort-Object Name
          $checksumLines = foreach ($asset in $assets) {
            $hash = (Get-FileHash -LiteralPath $asset.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($asset.Name)"
          }
          [System.IO.File]::WriteAllLines(
            (Join-Path $env:GITHUB_WORKSPACE 'release\SHA256SUMS.txt'),
            $checksumLines,
            [System.Text.UTF8Encoding]::new($false)
          )

      - name: Verify release assets
        shell: pwsh
        run: |
          $expected = @(
            "LocalInfoReminder-$env:RELEASE_VERSION-Windows-x64-Setup.exe",
            "LocalInfoReminder-$env:RELEASE_VERSION-Windows-x64.zip",
            'SHA256SUMS.txt'
          )
          foreach ($name in $expected) {
            if (-not (Test-Path -LiteralPath (Join-Path 'release' $name))) {
              throw "Missing release asset: $name"
            }
          }
          Get-Content -LiteralPath 'release\SHA256SUMS.txt' -Encoding UTF8

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          $assets = Get-ChildItem -LiteralPath release -File | ForEach-Object { $_.FullName }
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $assets --clobber
          } else {
            gh release create $tag $assets --verify-tag --generate-notes --title $tag
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
